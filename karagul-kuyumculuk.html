<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karagul Kuyumculuk</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,0.5);
}

/* UST BASLIK */
.header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.header h1 {
    color: #d4af37;
    font-size: 30px;
    margin-bottom: 5px;
}

.header p {
    font-size: 15px;
    color: #ddd;
}

/* ICERIK */
.content {
    padding: 25px 20px;
    text-align: center;
}

.bank {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
}

.label {
    color: #777;
    font-size: 13px;
    margin-top: 15px;
    margin-bottom: 5px;
}

.name {
    font-size: 21px;
    font-weight: bold;
}

.iban {
    margin-top: 8px;
    padding: 15px 8px;
    border: 2px solid #d4af37;
    border-radius: 12px;
    background: #f7f7f7;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
    word-break: break-all;
}

/* ACIKLAMA */
.description {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #fff8df;
    border: 1px solid #d4af37;
}

.description .title {
    font-size: 13px;
    color: #777;
    margin-bottom: 5px;
}

.description .text {
    font-size: 17px;
    font-weight: bold;
}

/* INSTAGRAM */
.instagram {
    display: inline-block;
    margin-top: 22px;
    text-decoration: none;
    color: #111;
    font-weight: bold;
    font-size: 16px;
}

.instagram span {
    color: #c08b00;
}

/* ALT */
.footer {
    background: #111;
    color: #aaa;
    text-align: center;
    padding: 14px;
    font-size: 12px;
}

.footer strong {
    color: #d4af37;
}
</style>
</head>

<body>

<div class="card">

    <!-- BASLIK -->
    <div class="header">
        <h1>Karagul Kuyumculuk</h1>
        <p>Odeme Bilgileri</p>
    </div>

    <!-- BILGILER -->
    <div class="content">

        <div class="bank">
            Turkiye Is Bankasi
        </div>

        <div class="label">
            ALICI
        </div>

        <div class="name">
            Rifat Karagul
        </div>

        <div class="label">
            IBAN
        </div>

        <div class="iban">
            TR810006400000183040549247
        </div>

        <!-- ACIKLAMA -->
        <div class="description">

            <div class="title">
                ACIKLAMA
            </div>

            <div class="text">
                Altin Bedeli &amp; T.C.
            </div>

        </div>

        <!-- INSTAGRAM -->
        <a
            class="instagram"
            href="https://www.instagram.com/karagul_kuyumculuk/"
            target="_blank"
        >
            Instagram:
            <span>@karagul_kuyumculuk</span>
        </a>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <strong>Karagul Kuyumculuk</strong>
    </div>

</div>

</body>
</html>
