<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuaför Çav Bella - Ödeme</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;display:flex;justify-content:center;align-items:center;padding:20px;color:#111
}
.kart{
  width:100%;max-width:430px;background:#fff;border:2px solid #111;border-radius:28px;
  padding:32px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.10)
}
.logo{
  width:82px;height:82px;margin:0 auto 16px;border-radius:50%;background:#111;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:36px
}
h1{font-size:25px;margin:0 0 8px}
.alt{color:#777;font-size:14px;margin-bottom:26px}
.banka{font-size:17px;font-weight:800;margin-bottom:18px}
.etiket{font-size:12px;color:#888;margin-top:15px;margin-bottom:5px}
.deger{font-size:17px;font-weight:800}
.iban{
  margin:8px 0 18px;padding:15px 12px;background:#f3f3f3;border-radius:15px;
  font-size:17px;font-weight:800;line-height:1.55;letter-spacing:.3px;word-break:break-word
}
button{
  width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;
  cursor:pointer;background:#e30613;color:#fff
}
.bildirim{
  opacity:0;margin-top:12px;font-size:14px;font-weight:700;color:#188038;
  transition:.2s
}
.bildirim.goster{opacity:1}
.nevopay{margin-top:24px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="kart">
  <div class="logo">✂</div>
  <h1>KUAFÖR ÇAV BELLA</h1>
  <div class="alt">IBAN ile güvenli ödeme</div>

  <div class="banka">Ziraat Bankası</div>

  <div class="etiket">HESAP SAHİBİ</div>
  <div class="deger">FERHAT AYATA</div>

  <div class="etiket">IBAN</div>
  <div class="iban" id="iban">TR92 0001 0003 9187 9336 0050 01</div>

  <button onclick="kopyala()">IBAN KOPYALA</button>
  <div class="bildirim" id="bildirim">✓ IBAN kopyalandı</div>

  <div class="nevopay">NevoPay</div>
</div>

<script>
function kopyala(){
  const iban="TR920001000391879336005001";
  navigator.clipboard.writeText(iban).then(()=>{
    const b=document.getElementById("bildirim");
    b.classList.add("goster");
    setTimeout(()=>b.classList.remove("goster"),2200);
  }).catch(()=>{
    const t=document.createElement("textarea");
    t.value=iban;document.body.appendChild(t);t.select();
    document.execCommand("copy");t.remove();
    const b=document.getElementById("bildirim");
    b.classList.add("goster");
    setTimeout(()=>b.classList.remove("goster"),2200);
  });
}
</script>
</body>
</html>
