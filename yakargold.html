<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yakar Gold - Ödeme</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#111;
}

.kart{
  width:100%;
  max-width:430px;
  background:#fff;
  border:2px solid #d4af37;
  border-radius:28px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.10);
}

/* YG LOGO */
.logo{
  width:76px;
  height:76px;
  margin:0 auto 15px;
  border:3px solid #d4af37;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:800;
  color:#111;
  letter-spacing:-2px;
}

h1{
  margin:0;
  font-size:25px;
  font-weight:800;
  letter-spacing:.5px;
}

.alt-baslik{
  margin-top:6px;
  margin-bottom:28px;
  font-size:13px;
  color:#888;
}

/* BANKA KARTLARI */
.banka{
  background:#fafafa;
  border:1px solid #ececec;
  border-radius:20px;
  padding:21px 18px;
  margin-top:16px;
}

.banka-adi{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.albaraka{
  color:#008a68;
}

.ziraat{
  color:#d71920;
}

.etiket{
  font-size:11px;
  color:#999;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.isim{
  font-size:16px;
  font-weight:700;
  margin-bottom:16px;
}

.iban{
  font-family:Arial,sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1.6;
  letter-spacing:.3px;
  word-spacing:2px;
  margin-bottom:16px;
}

/* BUTONLAR */
.kopyala{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  font-size:15px;
  font-weight:800;
  color:white;
  cursor:pointer;
  transition:.15s;
}

.kopyala:active{
  transform:scale(.98);
}

.albaraka-btn{
  background:#008a68;
}

.ziraat-btn{
  background:#d71920;
}

/* BİLDİRİM */
.bildirim{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%) translateY(20px);
  background:#111;
  color:#fff;
  padding:12px 20px;
  border-radius:30px;
  font-size:14px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.bildirim.goster{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:480px){
  body{
    padding:14px;
  }

  .kart{
    padding:28px 18px;
    border-radius:24px;
  }

  .iban{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="kart">

  <div class="logo">YG</div>

  <h1>YAKAR GOLD</h1>
  <div class="alt-baslik">IBAN Ödeme Bilgileri</div>


  <!-- ALBARAKA -->
  <div class="banka">

    <div class="banka-adi albaraka">
      Albaraka Türk
    </div>

    <div class="etiket">Hesap Sahibi</div>
    <div class="isim">
      FATİH ERELİ
    </div>

    <div class="etiket">IBAN</div>

    <div class="iban">
      TR16 0020 3000 0913 9118 0000 02
    </div>

    <button
      class="kopyala albaraka-btn"
      onclick="ibanKopyala(
      'TR160020300009139118000002',
      'Albaraka Türk'
      )">
      IBAN Kopyala
    </button>

  </div>


  <!-- ZİRAAT -->
  <div class="banka">

    <div class="banka-adi ziraat">
      Ziraat Bankası
    </div>

    <div class="etiket">Hesap Sahibi</div>
    <div class="isim">
      FATİH ERELİ
    </div>

    <div class="etiket">IBAN</div>

    <div class="iban">
      TR45 0001 0014 6784 9123 6350 05
    </div>

    <button
      class="kopyala ziraat-btn"
      onclick="ibanKopyala(
      'TR450001001467849123635005',
      'Ziraat Bankası'
      )">
      IBAN Kopyala
    </button>

  </div>

</div>


<div id="bildirim" class="bildirim">
  IBAN kopyalandı
</div>


<script>
function ibanKopyala(iban,banka){

  navigator.clipboard.writeText(iban).then(function(){

    const bildirim =
      document.getElementById("bildirim");

    bildirim.innerText =
      banka + " IBAN kopyalandı";

    bildirim.classList.add("goster");

    setTimeout(function(){
      bildirim.classList.remove("goster");
    },2000);

  }).catch(function(){

    const textarea =
      document.createElement("textarea");

    textarea.value = iban;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    document.body.removeChild(textarea);

    const bildirim =
      document.getElementById("bildirim");

    bildirim.innerText =
      banka + " IBAN kopyalandı";

    bildirim.classList.add("goster");

    setTimeout(function(){
      bildirim.classList.remove("goster");
    },2000);

  });

}
</script>

</body>
</html>
