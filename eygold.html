<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emrah Yaşar Gold - IBAN Ödeme</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: min(92%, 430px);
    background: white;
    padding: 28px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    color: #c99a2e;
    margin-bottom: 8px;
}

.title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #222;
}

.bank-box {
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    background: #fafafa;
}

.bank {
    font-size: 18px;
    font-weight: 700;
    color: #222;
    margin-bottom: 12px;
}

.label {
    font-size: 13px;
    color: #777;
    margin-top: 8px;
}

.name {
    font-size: 16px;
    font-weight: 600;
    color: #222;
    margin-top: 3px;
}

.iban {
    margin-top: 8px;
    padding: 13px 10px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    word-break: break-all;
    color: #222;
}

.copy-btn {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    background: #c99a2e;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.copy-btn:active {
    transform: scale(.98);
}

.instagram {
    display: block;
    margin-top: 18px;
    text-decoration: none;
    color: #c99a2e;
    font-weight: 700;
}

.footer {
    margin-top: 18px;
    font-size: 12px;
    color: #999;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">Emrah Yaşar Gold</div>

    <div class="title">IBAN Ödeme</div>


    <!-- ZİRAAT BANKASI -->
    <div class="bank-box">

        <div class="bank">Ziraat Bankası</div>

        <div class="label">Ad Soyad</div>
        <div class="name">Emrah Yaşar</div>

        <div class="label">IBAN</div>

        <div class="iban" id="ziraatIban">
            MEVCUT ZİRAAT IBANIN
        </div>

        <button class="copy-btn" onclick="copyIBAN('ziraatIban', this)">
            IBAN KOPYALA
        </button>

    </div>


    <!-- KUVEYT TÜRK -->
    <div class="bank-box">

        <div class="bank">Kuveyt Türk</div>

        <div class="label">Ad Soyad</div>
        <div class="name">Emrah Yaşar</div>

        <div class="label">IBAN</div>

        <div class="iban" id="kuveytIban">
            TR89 0020 5000 0922 5792 1000 01
        </div>

        <button class="copy-btn" onclick="copyIBAN('kuveytIban', this)">
            IBAN KOPYALA
        </button>

    </div>


    <a class="instagram"
       href="https://www.instagram.com/"
       target="_blank">
        Instagram
    </a>

    <div class="footer">
        Ödeme yapmak için yukarıdaki IBAN'lardan birini kullanabilirsiniz.
    </div>

</div>


<script>

function copyIBAN(id, button) {

    const iban = document.getElementById(id).innerText.trim();

    navigator.clipboard.writeText(iban).then(() => {

        const eskiYazi = button.innerText;

        button.innerText = "IBAN KOPYALANDI";

        setTimeout(() => {
            button.innerText = eskiYazi;
        }, 2000);

    }).catch(() => {

        alert("IBAN kopyalanamadı.");

    });

}

</script>

</body>
</html>
