<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropol Gold - Ödeme</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#111;
    }

    .kart{
      width:100%;
      max-width:430px;
      background:#fff;
      border:2px solid #d4af37;
      border-radius:28px;
      padding:34px 24px;
      text-align:center;
      box-shadow:0 10px 35px rgba(0,0,0,.12);
    }

    /* MG LOGO */
    .logo{
      width:76px;
      height:76px;
      margin:0 auto 14px;
      border-radius:50%;
      background:linear-gradient(145deg,#f5dc78,#b8860b);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:28px;
      font-weight:800;
    }

    h1{
      font-size:25px;
      margin:0 0 8px;
    }

    .alt{
      color:#777;
      margin:0 0 25px;
    }

    .hesap{
      border:1px solid #eadca8;
      border-radius:18px;
      padding:18px 15px;
      margin-top:16px;
      background:#fffdf7;
    }

    .banka{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .etiket{
      font-size:12px;
      color:#777;
      margin-top:9px;
    }

    .isim{
      font-size:17px;
      font-weight:700;
      margin-top:4px;
    }

    .iban{
      font-family:Arial,sans-serif;
      font-size:16px;
      font-weight:700;
      line-height:1.6;
      overflow-wrap:anywhere;
      margin:5px 0 14px;
    }

    button{
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px 10px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    button:active{
      transform:scale(.98);
    }

    /* AKBANK KIRMIZI */
    .akbank{
      background:#e30613;
      color:#fff;
    }

    /* VAKIFBANK SARI */
    .vakif{
      background:#f6c500;
      color:#111;
    }

    /* KOPYALANDI BİLDİRİMİ */
    #bildirim{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translateX(-50%);
      background:#222;
      color:#fff;
      padding:12px 20px;
      border-radius:10px;
      opacity:0;
      pointer-events:none;
      transition:.25s;
      white-space:nowrap;
    }

    #bildirim.goster{
      opacity:1;
    }
  </style>
</head>

<body>

  <main class="kart">

    <!-- MG LOGO -->
    <div class="logo">MG</div>

    <h1>METROPOL GOLD</h1>

    <p class="alt">
      IBAN Ödeme Bilgileri
    </p>


    <!-- AKBANK -->

    <section class="hesap">

      <div class="banka">
        Akbank
      </div>

      <div class="etiket">
        HESAP SAHİBİ
      </div>

      <div class="isim">
        ABDUSSELAM ÇELİK
      </div>

      <div class="etiket">
        IBAN
      </div>

      <div class="iban">
        TR84 0004 6013 6088 8000 1400 51
      </div>

      <button
        class="akbank"
        onclick="kopyala('TR840004601360888000140051')">
        Akbank IBAN Kopyala
      </button>

    </section>


    <!-- VAKIFBANK -->

    <section class="hesap">

      <div class="banka">
        VakıfBank
      </div>

      <div class="etiket">
        HESAP SAHİBİ
      </div>

      <div class="isim">
        ABDUSSELAM ÇELİK
      </div>

      <div class="etiket">
        IBAN
      </div>

      <div class="iban">
        TR98 0001 5001 5800 7356 7599 63
      </div>

      <button
        class="vakif"
        onclick="kopyala('TR980001500158007356759963')">
        VakıfBank IBAN Kopyala
      </button>

    </section>

  </main>


  <div id="bildirim">
    IBAN kopyalandı
  </div>


  <script>

    function kopyala(iban){

      const tamamlandi = () => {

        const b = document.getElementById('bildirim');

        b.classList.add('goster');

        setTimeout(
          () => b.classList.remove('goster'),
          1800
        );
      };


      if(
        navigator.clipboard &&
        window.isSecureContext
      ){

        navigator.clipboard
          .writeText(iban)
          .then(tamamlandi)
          .catch(() => eskiKopyala(iban,tamamlandi));

      }else{

        eskiKopyala(iban,tamamlandi);

      }
    }


    function eskiKopyala(metin,tamamlandi){

      const a = document.createElement('textarea');

      a.value = metin;
      a.style.position = 'fixed';
      a.style.opacity = '0';

      document.body.appendChild(a);

      a.select();

      document.execCommand('copy');

      a.remove();

      tamamlandi();
    }

  </script>

</body>
</html>
