<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elmacı Tesettür - Ödeme</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#111
}

.kart{
  width:100%;
  max-width:430px;
  background:#fff;
  border:2px solid #d4af37;
  border-radius:28px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.10)
}

.logo{
  width:76px;
  height:76px;
  margin:0 auto 15px;
  border:3px solid #d4af37;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:800;
  color:#111
}

h1{
  margin:0;
  font-size:25px;
  font-weight:800;
  letter-spacing:.4px
}

.alt{
  margin:6px 0 28px;
  font-size:13px;
  color:#888
}

.banka{
  background:#fafafa;
  border:1px solid #ececec;
  border-radius:20px;
  padding:22px 18px
}

.banka-adi{
  font-size:18px;
  font-weight:800;
  color:#0b7a55;
  margin-bottom:16px
}

.etiket{
  font-size:11px;
  color:#999;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.7px
}

.isim{
  font-size:16px;
  font-weight:700;
  margin-bottom:17px
}

.iban{
  font-family:Arial,sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1.6;
  word-spacing:2px;
  margin-bottom:17px
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#0b7a55;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer
}

button:active{
  transform:scale(.98)
}

.bildirim{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%) translateY(20px);
  background:#111;
  color:#fff;
  padding:12px 20px;
  border-radius:30px;
  font-size:14px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap
}

.bildirim.goster{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

@media(max-width:480px){
  body{padding:14px}
  .kart{padding:28px 18px;border-radius:24px}
  .iban{font-size:14px}
}
</style>
</head>

<body>

<div class="kart">

  <div class="logo">ET</div>

  <h1>ELMACI TESETTÜR</h1>

  <div class="alt">IBAN Ödeme Bilgileri</div>

  <div class="banka">

    <div class="banka-adi">Kuveyt Türk</div>

    <div class="etiket">Hesap Sahibi</div>

    <div class="isim">MEHMET EMİN ELMACİ</div>

    <div class="etiket">IBAN</div>

    <div class="iban">
      TR73 0020 5000 0951 3236 4000 01
    </div>

    <button onclick="kopyala()">
      IBAN Kopyala
    </button>

  </div>

</div>

<div id="bildirim" class="bildirim">
  IBAN kopyalandı
</div>

<script>
function kopyala(){

  const iban="TR730020500009513236400001";

  const goster=()=>{

    const b=document.getElementById("bildirim");

    b.innerText="Kuveyt Türk IBAN kopyalandı";

    b.classList.add("goster");

    setTimeout(()=>{
      b.classList.remove("goster");
    },2000);

  };

  if(navigator.clipboard && window.isSecureContext){

    navigator.clipboard.writeText(iban).then(goster);

  }else{

    const t=document.createElement("textarea");

    t.value=iban;

    document.body.appendChild(t);

    t.select();

    document.execCommand("copy");

    t.remove();

    goster();
  }
}
</script>

</body>
</html>
