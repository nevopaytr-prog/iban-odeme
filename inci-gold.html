<head>

<title>İnci Gold - Ödeme</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Arial, sans-serif;
    background: #ffffff;

.kart {

    border-radius: 28px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);

.logo {
    width: 75px;
    height: 75px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 2px solid #d4af37;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #b08d20;
    font-size: 28px;
    font-weight: bold;

h1 {
    margin: 0;
    font-size: 32px;
    color: #b08d20;
    letter-spacing: 1px;
}

.alt {
    margin-top: 8px;

    letter-spacing: 2px;
}

.cizgi {
    width: 70px;
    height: 2px;
    background: #d4af37;
    margin: 25px auto;
}

.bilgi {
    background: #fafafa;
    border: 1px solid #dddddd;

.baslik {
    color: #777777;

    color: #111111;

    margin-bottom: 18px;
}

.iban {
    font-size: 16px;
    line-height: 1.7;
    word-break: break-all;
    color: #111111;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #d4af37;
    color: #111111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #c29f2f;

.mesaj {
    display: none;

</style>
</head>

<body>

<div class="kart">

    <div class="logo">İG</div>

    <h1>İnci Gold</h1>

    <div class="alt">
        GÜVENLİ ÖDEME

        </div>

            IBAN
        </div>

        <div class="deger iban" id="iban">

        </div>

    </div>

    <button onclick="kopyala()">
        IBAN'I KOPYALA
    </button>

    <div class="mesaj" id="mesaj">
        ✓ IBAN kopyalandı
    </div>

    <div class="altbilgi">

    </div>

</div>

<script>
function kopyala() {

    const iban = "TR850020500009414456100003";

    navigator.clipboard.writeText(iban).then(function() {

        const mesaj = document.getElementById("mesaj");

        mesaj.style.display = "block";

        setTimeout(function() {
            mesaj.style.display = "none";
        }, 2500);

    });
}
</script>

</body>
