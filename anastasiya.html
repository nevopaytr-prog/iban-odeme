<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Emre Tekçi - IBAN Ödeme</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f5f7;
  padding:20px;
}

.card{
  width:min(92%,420px);
  padding:28px;
  background:#fff;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
  text-align:center;
}

.bank{
  font-size:17px;
  font-weight:700;
  color:#333;
  margin-bottom:14px;
}

.label{
  font-size:13px;
  color:#999;
  margin-top:18px;
  margin-bottom:6px;
}

.name{
  font-size:25px;
  font-weight:700;
  color:#222;
}

.iban{
  margin-top:8px;
  padding:14px 10px;
  background:#f6f6f6;
  border-radius:12px;
  font-size:17px;
  font-weight:600;
  letter-spacing:.5px;
  color:#222;
  word-break:break-word;
  cursor:pointer;
  user-select:none;
}

.button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.button:active{
  transform:scale(.98);
}

.copy-info{
  margin-top:12px;
  min-height:20px;
  font-size:14px;
  color:#16803c;
  font-weight:600;
}
</style>
</head>

<body>

<div class="card">

  <div class="bank">AKBANK</div>

  <div class="label">ALICI</div>
  <div class="name">EMRE TEKÇİ</div>

  <div class="label">IBAN</div>

  <div class="iban" onclick="copyIBAN()">
    TR36 0004 6000 0888 0000 3107 53
  </div>

  <button class="button" onclick="copyIBAN()">
    IBAN'ı Kopyala
  </button>

  <div class="copy-info" id="copyInfo"></div>

</div>

<script>
function copyIBAN(){

  const iban = "TR360004600008880000310753";

  navigator.clipboard.writeText(iban).then(() => {

    document.getElementById("copyInfo").textContent =
      "IBAN kopyalandı";

    const text = new SpeechSynthesisUtterance(
      "IBAN kopyalandı"
    );

    text.lang = "tr-TR";
    text.rate = 1;

    speechSynthesis.cancel();
    speechSynthesis.speak(text);

    setTimeout(() => {
      document.getElementById("copyInfo").textContent = "";
    }, 2500);

  });

}
</script>

</body>
</html>
