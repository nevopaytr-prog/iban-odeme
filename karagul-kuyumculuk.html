<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karagul Kuyumculuk</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: #fff;
  border-radius: 22px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

.logo {
  font-size: 30px;
  font-weight: bold;
  color: #111;
  margin-bottom: 5px;
}

.subtitle {
  color: #b08d2c;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 25px;
}

.bank {
  background: #111;
  color: #fff;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 20px;
  font-size: 18px;
  font-weight: bold;
}

.label {
  color: #777;
  font-size: 14px;
  margin-top: 15px;
  margin-bottom: 5px;
}

.name {
  font-size: 21px;
  font-weight: bold;
  color: #111;
}

.iban-box {
  margin-top: 8px;
  background: #f4f4f4;
  border: 2px solid #b08d2c;
  border-radius: 12px;
  padding: 15px 8px;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
  word-break: break-all;
}

.copy-btn {
  margin-top: 12px;
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #b08d2c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.note {
  margin-top: 20px;
  background: #fff8df;
  border-radius: 10px;
  padding: 13px;
  color: #333;
  font-size: 14px;
}

.instagram {
  display: inline-block;
  margin-top: 22px;
  text-decoration: none;
  color: #111;
  font-weight: bold;
  font-size: 16px;
}

.instagram span {
  color: #b08d2c;
}

.footer {
  margin-top: 25px;
  color: #999;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    Karagul Kuyumculuk
  </div>

  <div class="subtitle">
    Guvenli Odeme
  </div>

  <div class="bank">
    Turkiye Is Bankasi
  </div>

  <div class="label">
    ALICI
  </div>

  <div class="name">
    Rifat Karagul
  </div>

  <div class="label">
    IBAN
  </div>

  <div class="iban-box">
    TR810006400000183040549247
  </div>

  <button class="copy-btn" onclick="copyIBAN()">
    IBAN'I KOPYALA
  </button>

  <div class="note">
    Aciklama kismina <b>Altin Bedeli &amp; T.C.</b> yaziniz.
  </div>

  <a
    class="instagram"
    href="https://www.instagram.com/karagul_kuyumculuk/"
    target="_blank"
  >
    Instagram:
    <span>@karagul_kuyumculuk</span>
  </a>

  <div class="footer">
    Karagul Kuyumculuk
  </div>

</div>

<script>

function copyIBAN() {

  const iban = "TR810006400000183040549247";

  navigator.clipboard.writeText(iban).then(function() {

    const button = document.querySelector(".copy-btn");

    button.textContent = "IBAN KOPYALANDI";

    setTimeout(function() {
      button.textContent = "IBAN'I KOPYALA";
    }, 2000);

  });

}

</script>

</body>
</html>
