<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Samira Gold - IBAN Ödeme</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f5f7;
}

.card{
  width:min(92%,420px);
  padding:28px;
  background:#fff;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
  text-align:center;
}

.logo{
  width:80px;
  height:80px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:#d4af37;
  font-size:24px;
  font-weight:800;
}

h1{
  margin:0 0 6px;
  font-size:26px;
  color:#111;
}

.subtitle{
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.label{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.name{
  font-size:18px;
  font-weight:700;
  color:#111;
  margin-bottom:20px;
}

.iban-box{
  padding:16px 12px;
  border-radius:14px;
  background:#f7f7f7;
  border:1px solid #eee;
  margin-bottom:14px;
}

.iban{
  font-size:16px;
  font-weight:700;
  letter-spacing:.5px;
  word-break:break-all;
  color:#111;
}

button,
.instagram{
  width:100%;
  display:block;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}

.copy{
  background:#111;
  color:#fff;
}

.copy:active{
  transform:scale(.98);
}

.instagram{
  background:#d4af37;
  color:#111;
}

.sound{
  background:#eee;
  color:#111;
}

.status{
  min-height:20px;
  margin-top:12px;
  font-size:13px;
  color:#777;
}

.footer{
  margin-top:22px;
  font-size:11px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">SG</div>

  <h1>Samira Gold</h1>

  <div class="subtitle">
    Güvenli IBAN Ödeme
  </div>

  <div class="label">HESAP SAHİBİ</div>

  <div class="name">
    Muhammed Raşit Çiçekli
  </div>

  <div class="label">IBAN</div>

  <div class="iban-box">
    <div class="iban" id="iban">
      TR86 0001 0020 0079 5724 7750 04
    </div>
  </div>

  <button class="copy" onclick="copyIban()">
    IBAN'I KOPYALA
  </button>

  <a
    class="instagram"
    href="https://www.instagram.com/samiraagold"
    target="_blank">
    INSTAGRAM @samiraagold
  </a>

  <button class="sound" onclick="sesOynat()">
    🔊 SESLİ BİLGİ
  </button>

  <div class="status" id="status"></div>

  <div class="footer">
    Samira Gold
  </div>

</div>

<script>

function copyIban(){

  const iban =
    "TR860001002000795724775004";

  navigator.clipboard.writeText(iban).then(function(){

    document.getElementById("status").textContent =
      "IBAN kopyalandı ✓";

  }).catch(function(){

    document.getElementById("status").textContent =
      "IBAN: " + iban;

  });

}


function sesOynat(){

  const metin =
    "Samira Gold. Ödeme için IBAN bilgileri aşağıda yer almaktadır. Hesap sahibi Muhammed Raşit Çiçekli.";

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const ses =
      new SpeechSynthesisUtterance(metin);

    ses.lang = "tr-TR";
    ses.rate = 0.9;
    ses.pitch = 1;

    speechSynthesis.speak(ses);

  }else{

    document.getElementById("status").textContent =
      "Cihazınız sesli okumayı desteklemiyor.";

  }

}

</script>

</body>
</html>
