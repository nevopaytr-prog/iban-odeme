```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azim Gold - Ödeme</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --gold:#d4af37;
  --gold-dark:#a98519;
  --text:#151515;
  --muted:#7b7b7b;
  --border:#ece8dc;
  --soft:#faf9f5;
  --red:#e30613;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at top,#fffdf5 0%,#f7f5ef 45%,#efede7 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
  color:var(--text);
}

.kart{
  width:100%;
  max-width:440px;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(212,175,55,.35);
  border-radius:30px;
  padding:30px 24px 26px;
  text-align:center;
  box-shadow:
    0 20px 50px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
  overflow:hidden;
  position:relative;
}

.kart::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:5px;
  background:linear-gradient(
    90deg,
    #8e6d0d,
    #d4af37,
    #f2d978,
    #d4af37,
    #8e6d0d
  );
}

/* LOGO */
.ag-logo{
  width:92px;
  height:92px;
  margin:4px auto 16px;
  border-radius:50%;
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(145deg,#fff,#f6f1df);
  box-shadow:
    0 8px 24px rgba(212,175,55,.18),
    inset 0 0 0 5px rgba(212,175,55,.08);
  position:relative;
}

.ag-logo::after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:1px solid rgba(212,175,55,.38);
}

.ag-logo span{
  position:relative;
  z-index:2;
  font-size:28px;
  font-weight:900;
  letter-spacing:-2px;
}

h1{
  margin:0;
  font-size:30px;
  font-weight:900;
  letter-spacing:1.4px;
}

.alt-baslik{
  margin-top:7px;
  margin-bottom:26px;
  color:var(--muted);
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.banka-kutu{
  background:linear-gradient(180deg,#fff,#fbfaf6);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

.banka{
  font-size:11px;
  color:#999;
  letter-spacing:1.6px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.banka-adi{
  font-size:22px;
  font-weight:900;
  color:var(--red);
}

.bilgi{
  text-align:left;
  background:linear-gradient(180deg,#fff,#fbfbfa);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 5px 16px rgba(0,0,0,.035);
}

.etiket{
  font-size:11px;
  color:#929292;
  margin-bottom:8px;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.deger{
  font-size:18px;
  font-weight:800;
}

.iban{
  font-size:17px;
  font-weight:800;
  letter-spacing:.45px;
  line-height:1.65;
  word-break:break-word;
  color:#1a1a1a;
}

/* BUTON */
button{
  width:100%;
  border:none;
  background:
    linear-gradient(135deg,#111,#272727);
  color:#fff;
  font-size:15px;
  font-weight:900;
  padding:16px;
  border-radius:15px;
  cursor:pointer;
  transition:.2s ease;
  box-shadow:0 10px 22px rgba(0,0,0,.14);
  letter-spacing:.4px;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 13px 25px rgba(0,0,0,.18);
}

button:active{
  transform:scale(.985);
}

.alt-not{
  margin-top:17px;
  font-size:11px;
  color:#9a8544;
  letter-spacing:1.2px;
}

/* BİLDİRİM */
#bildirim{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translateX(-50%) translateY(20px);
  background:#111;
  color:#fff;
  padding:13px 20px;
  border-radius:30px;
  font-size:14px;
  font-weight:700;
  opacity:0;
  visibility:hidden;
  transition:.3s;
  white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

#bildirim.goster{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:480px){

  .kart{
    padding:28px 18px 24px;
    border-radius:25px;
  }

  .ag-logo{
    width:84px;
    height:84px;
  }

  .ag-logo span{
    font-size:26px;
  }

  h1{
    font-size:27px;
  }

  .banka-adi{
    font-size:20px;
  }

  .iban{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="kart">

  <div class="ag-logo">
    <span>A</span>
    <span>G</span>
  </div>

  <h1>AZİM GOLD</h1>

  <div class="alt-baslik">
    Güvenli Ödeme Bilgileri
  </div>

  <div class="banka-kutu">

    <div class="banka">
      Banka
    </div>

    <div class="banka-adi">
      Ziraat Bankası
    </div>

  </div>

  <div class="bilgi">

    <div class="etiket">
      Hesap Sahibi
    </div>

    <div class="deger">
      RAMAZAN TURUN
    </div>

  </div>

  <div class="bilgi">

    <div class="etiket">
      IBAN
    </div>

    <div class="iban">
      TR39 0001 0020 0069 4788 5850 11
    </div>

  </div>

  <button onclick="ibanKopyala()">
    IBAN'I KOPYALA
  </button>

  <div class="alt-not">
    AZİM GOLD • GÜVENLİ ÖDEME
  </div>

</div>

<div id="bildirim">
  ✓ IBAN kopyalandı
</div>

<script>
function ibanKopyala(){

  const iban = "TR390001002000694788585011";

  navigator.clipboard.writeText(iban).then(function(){

    bildirimGoster();

  }).catch(function(){

    const alan = document.createElement("textarea");
    alan.value = iban;

    document.body.appendChild(alan);
    alan.select();
    document.execCommand("copy");
    document.body.removeChild(alan);

    bildirimGoster();

  });
}

function bildirimGoster(){

  const bildirim = document.getElementById("bildirim");

  bildirim.classList.add("goster");

  setTimeout(function(){
    bildirim.classList.remove("goster");
  },2000);
}
</script>

</body>
</html>
